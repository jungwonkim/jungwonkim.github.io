<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jungwon Kim</title>
<link rel="icon" href="favicon.png?v=2"/>
<style>
html, body  { margin:0; background:#000; color:#f5f5f5;
              font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.profile    { max-width:935px; margin:0 auto; padding:30px 20px 0; }

.header     { display:flex; align-items:center; gap:30px; padding-bottom:30px;
              border-bottom:1px solid #262626; }
.avatar     { width:150px; height:150px; border-radius:50%; flex-shrink:0; object-fit:cover; }
.info h1    { font-size:20px; font-weight:400; margin:0 0 16px; }
.stats      { display:flex; gap:40px; font-size:16px; margin-bottom:16px; }
.stats b    { font-weight:600; }
.bio        { font-size:24px; line-height:32px; }

.grid       { display:grid; grid-template-columns:repeat(3, 1fr); gap:4px; padding:20px 0; }
.tile       { position:relative; aspect-ratio:1; display:flex; align-items:center; justify-content:center;
              overflow:hidden; background:#121212; color:#f5f5f5; text-decoration:none;
              font-size:clamp(14px, 2.4vw, 24px); font-weight:600; }
.tile::before { content:""; position:absolute; inset:0; transition:filter 0.15s ease, transform 0.15s ease; }
.tile:hover::before { filter:brightness(0.8); transform:scale(1.04); }
.tile span  { position:relative; padding:6px 12px; background:rgba(0,0,0,0.45); border-radius:4px; }

.tile:nth-child(1)::before { background:
  radial-gradient(circle at 25% 30%, #ffb27a 0%, transparent 55%),
  radial-gradient(circle at 75% 70%, #ff6b8b 0%, transparent 55%),
  radial-gradient(circle at 60% 20%, #ffd166 0%, transparent 50%),
  #f4a261; }
.tile:nth-child(2)::before { background:
  radial-gradient(circle at 30% 70%, #8ec5ff 0%, transparent 55%),
  radial-gradient(circle at 75% 30%, #b892ff 0%, transparent 55%),
  radial-gradient(circle at 50% 90%, #6ee7f7 0%, transparent 50%),
  #7aa2f7; }
.tile:nth-child(3)::before { background:
  radial-gradient(circle at 70% 30%, #9be7c4 0%, transparent 55%),
  radial-gradient(circle at 25% 75%, #34d399 0%, transparent 55%),
  radial-gradient(circle at 80% 85%, #fde68a 0%, transparent 50%),
  #5eead4; }

footer      { text-align:center; color:#737373; font-size:12px; padding:30px 0 40px; }

@media (max-width:735px) {
  .header  { gap:20px; }
  .avatar  { width:86px; height:86px; }
  .stats   { gap:20px; font-size:14px; }
}
</style>
</head>
<body>
<div class="profile">

<div class="header">
  <img class="avatar" src="favicon.png" alt="Jungwon Kim">
  <div class="info">
    <h1>Jungwon Kim</h1>
    <div class="stats"><span><b>3</b> posts</span></div>
    <div class="bio">🚀 🔥 💻 ⚡ 🤖 🍜 🎸 🏄</div>
  </div>
</div>

<div class="grid">
  <a class="tile" href="https://jungwon.kim"><span>jungwon.kim</span></a>
  <a class="tile" href="https://jungwon.net"><span>jungwon.net</span></a>
  <a class="tile" href="https://jung1.com"><span>jung1.com</span></a>
</div>

<footer>© 2026 Jungwon Kim</footer>

</div>
</body>
</html>
